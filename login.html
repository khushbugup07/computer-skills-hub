<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Computer Skills Hub | Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-container {
            width: 350px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h1 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .tagline {
            color: #666;
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #login-message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="login-container">

        <h1>Computer Skills Hub</h1>

        <p class="tagline">
            Learn. Explore. Grow.
        </p>

        <h2>Welcome Back!</h2>

        <p style="color: #666; font-size: 14px;">
            Sign in to continue your learning journey.
        </p>

        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            placeholder="Enter your username"
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >

        <button onclick="loginUser()">
            Login
        </button>

        <p id="login-message"></p>

    </div>

    <script>

        function loginUser() {

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value.trim();

            const message =
                document.getElementById("login-message");

            if (username === "" || password === "") {

                message.textContent =
                    "Please enter your username and password.";

                message.style.color = "red";

                return;
            }

            message.textContent =
                "Login successful! Welcome to Computer Skills Hub.";

            message.style.color = "green";

            setTimeout(function() {

                window.location.href = "dashboard.html";

            }, 1000);
        }

    </script>

</body>

</html>
